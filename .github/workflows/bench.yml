name: bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sizes:
        description: 'Tamaños de lista (coma)'
        default: '1000,10000,50000'
      runs:
        description: 'Corridas por combinación'
        default: '5'

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx ng build

      # Fails the build if any strategy shows different data than the others.
      - run: npm run verify

      - name: Benchmark
        run: npm run bench
        env:
          SIZES: ${{ inputs.sizes || '1000,10000,50000' }}
          RUNS: ${{ inputs.runs || '3' }}

      - name: Publish results to the job summary
        run: cat results/RESULTS.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: results/
